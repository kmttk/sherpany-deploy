name: Full Deployment
on:
  workflow_dispatch:

jobs:
  deploy-phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./terraform-project/phase-0
    env:
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_azure_linux_vm_secret: ${{ secrets.AZURE_LIN_VM_SECRET }}
    steps:
      - uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3
      - name: Terraform Init Phase 0
        run: terraform init
      - name: Terraform Plan Phase 0
        run: terraform plan -out=phase3.tfplan
      - name: Terraform Apply Phase 0
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve phase3.tfplan

  deploy-phase1:
    runs-on: ubuntu-latest
    needs: [deploy-phase0]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./terraform-project/phase-one
    env:
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3
      - name: Terraform Init Phase 1
        run: terraform init
      - name: Terraform Plan Phase 1
        run: terraform plan -out=phase1.tfplan
      - name: Terraform Apply Phase 1
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve phase1.tfplan
      - name: Get ACR credentials
        run: |
          ACR_USERNAME=$(az acr credential show --name sherpanyacr --query "username" --output tsv)
          ACR_PASSWORD=$(az acr credential show --name sherpanyacr --query "passwords[0].value" --output tsv)
          echo "ACR_USERNAME=${ACR_USERNAME}" >> $GITHUB_ENV
          echo "ACR_PASSWORD=${ACR_PASSWORD}" >> $GITHUB_ENV
      - name: Set GitHub secrets
        run: |
          gh secret set ACR_USERNAME --body "$ACR_USERNAME"
          gh secret set ACR_PASSWORD --body "$ACR_PASSWORD"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-phase1-and-half:
    needs: [deploy-phase1]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./terraform-project/phase-one-and-half
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group sherpany-resources \
            --name sherpany-aks \
            --overwrite-existing
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3
      - name: Terraform Init Phase 1.5
        run: terraform init
      - name: Terraform Plan Phase 1.5
        run: terraform plan -out=phase1-5.tfplan
      - name: Terraform Apply Phase 1.5
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve phase1-5.tfplan

  build:
    needs: [deploy-phase1-and-half]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and Push Docker Image
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${{ secrets.ACR_NAME }}.azurecr.io/flask-app"
          az acr login --name ${{ secrets.ACR_NAME }}
          cd source
          docker build -t ${IMAGE_TAG}:${TIMESTAMP} -t ${IMAGE_TAG}:latest .
          docker push ${IMAGE_TAG}:${TIMESTAMP}
          docker push ${IMAGE_TAG}:latest

  deploy-phase2:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./terraform-project/phase-two
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get Storage Account Key
        id: get-storage-key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group sherpany-resources \
            --account-name sherpanyterraformstate \
            --query [0].value -o tsv)
          echo "ARM_ACCESS_KEY=$STORAGE_KEY" >> $GITHUB_ENV
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group sherpany-resources \
            --name sherpany-aks \
            --overwrite-existing
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=sherpany-resources" \
            -backend-config="storage_account_name=sherpanyterraformstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"
      - name: Terraform Plan Phase 2
        run: terraform plan -out=phase2.tfplan
      - name: Terraform Apply Phase 2
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve phase2.tfplan
