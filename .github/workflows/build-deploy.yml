name: Deploy or B & Deploy
on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip building the container?"
        type: boolean
        required: true
        default: false

jobs:
  build:
    timeout-minutes: 10
    if: inputs.skip_build == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Build and Push Docker Image
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${{ secrets.ACR_NAME }}.azurecr.io/flask-app"
          
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t ${IMAGE_TAG}:${TIMESTAMP} -t ${IMAGE_TAG}:latest .
          docker push ${IMAGE_TAG}:${TIMESTAMP}
          docker push ${IMAGE_TAG}:latest

  deploy:
    timeout-minutes: 10
    if: always() && (inputs.skip_build == true || needs.build.result == 'success')
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Connection
        run: |
          az account show
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3
      
      - name: Debug State
        run: |
          # List all state files
          az storage blob list \
            --account-name ${{ secrets.TERRAFORM_STORAGE_ACCOUNT }} \
            --container-name ${{ secrets.TERRAFORM_CONTAINER }} \
            --account-key ${{ secrets.TERRAFORM_ACCESS_KEY }} \
            --output table

          # Delete state if exists
          az storage blob delete \
            --account-name ${{ secrets.TERRAFORM_STORAGE_ACCOUNT }} \
            --container-name ${{ secrets.TERRAFORM_CONTAINER }} \
            --name terraform.tfstate \
            --account-key ${{ secrets.TERRAFORM_ACCESS_KEY }}

      - name: Terraform Init and Import
        env:
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TERRAFORM_CONTAINER }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="access_key=${{ secrets.TERRAFORM_ACCESS_KEY }}"

            # Import existing resource group
            terraform import azurerm_resource_group.sherpany_rg "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/sherpany-rg"
            
            # Import existing ACR
            terraform import azurerm_container_registry.acr "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/sherpany-rg/providers/Microsoft.ContainerRegistry/registries/${{ secrets.ACR_NAME }}"
            
            # Import existing AKS cluster
            terraform import azurerm_kubernetes_cluster.aks "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/sherpany-rg/providers/Microsoft.ContainerService/managedClusters/sherpany-aks"
            
            # Import existing Storage Account
            terraform import azurerm_storage_account.tfstate "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/sherpany-rg/providers/Microsoft.Storage/storageAccounts/${{ secrets.TERRAFORM_STORAGE_ACCOUNT }}"
          
          terraform plan -out=tfplan -refresh=false
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        run: terraform apply -auto-approve tfplan